<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="The personal site of Nick Rossetti.">
  <title>Nick Rossetti</title>
  <link rel="canonical" href="https://nrossetti.com/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23232323'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='42' fill='white'%3En%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light dark; --background: #fcfcfc; --text: #252525; --muted: #686868; --rule: #e3e3e3; --hover: #244c83; }
    * { box-sizing: border-box; }
    html { font-size: 100%; }
    body { margin: 0; background: var(--background); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(20rem, calc(100% - 3rem)); margin: 0 auto; padding: clamp(6rem, 36svh, 24rem) 0 5rem; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.625rem; font-weight: 400; line-height: 1.2; letter-spacing: -.04em; }
    nav { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; margin-top: .875rem; }
    a { display: inline-block; padding: .5rem 0; color: var(--muted); font-size: .875rem; line-height: 1.5; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: .3em; }
    a:hover { color: var(--hover); text-decoration-color: currentColor; }
    a:focus-visible { color: var(--text); outline: 2px solid currentColor; outline-offset: 5px; border-radius: 1px; }
    @media (prefers-color-scheme: dark) {
      :root { --background: #191919; --text: #eeeeec; --muted: #ababab; --rule: #363636; --hover: #a9caff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Nick Rossetti</h1>
    <nav aria-label="Contact and profiles">
      <a href="mailto:nicholasjrossetti@gmail.com">Email</a>
      <a href="https://github.com/nrossetti">GitHub</a>
      <a href="https://www.linkedin.com/in/nicholas-rossetti-569479136/">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
