<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9fafb">
  <meta name="description" content="Nick Rossetti — software developer. Find me on GitHub, connect on LinkedIn, or say hello.">
  <title>Nick Rossetti</title>
  <link rel="canonical" href="https://nrossetti.com/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232840d6'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='32' font-weight='700' text-anchor='middle' fill='white'%3Enr%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --paper: #f9fafb; --ink: #191c23; --muted: #606775; --accent: #2840d6; --line: #dce0e7; }
    * { box-sizing: border-box; }
    html { font-size: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    .page { width: min(100% - 112px, 1240px); min-height: 100svh; margin: auto; display: flex; flex-direction: column; }
    header { padding-top: 44px; }
    .monogram { display: inline-block; color: var(--accent); font-size: 26px; font-weight: 750; letter-spacing: -2px; }
    main { flex: 1; display: flex; align-items: center; padding: 100px 0 120px; }
    .intro { width: 100%; }
    .eyebrow { margin: 0 0 24px; color: var(--muted); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0 0 24px -5px; font-size: clamp(3.5rem, 9vw, 8rem); line-height: 1.04; font-weight: 600; letter-spacing: -.07em; }
    h1 span { color: var(--accent); }
    .description { margin: 0; color: var(--muted); font-size: clamp(1.125rem, 2vw, 1.375rem); line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 32px; margin-top: 44px; }
    a { color: var(--ink); font-size: 16px; text-decoration: none; border-bottom: 1px solid var(--line); padding: 9px 0; transition: color .15s, border-color .15s; }
    a span { color: var(--accent); margin-left: 8px; }
    a:hover { color: var(--accent); border-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 1px; }
    footer { border-top: 1px solid var(--line); padding: 24px 0 30px; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
    @media (max-width: 600px) {
      .page { width: calc(100% - 48px); }
      header { padding-top: 28px; }
      main { padding: 88px 0 100px; }
      h1 { margin-left: -2px; }
      nav { gap: 12px 24px; margin-top: 32px; }
      footer { padding: 22px 0; }
    }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header><span class="monogram" aria-label="Nick Rossetti">nr.</span></header>
    <main>
      <div class="intro">
        <p class="eyebrow">Software developer</p>
        <h1>Nick Rossetti<span>.</span></h1>
        <p class="description">A small corner of the internet.<br>Find my work, or get in touch.</p>
        <nav aria-label="Find me online">
          <a href="https://github.com/nrossetti">GitHub<span aria-hidden="true">↗</span></a>
          <a href="https://www.linkedin.com/in/nicholas-rossetti-569479136/">LinkedIn<span aria-hidden="true">↗</span></a>
          <a href="mailto:nicholasjrossetti@gmail.com">Say hello<span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </main>
    <footer>nrossetti.com</footer>
  </div>
</body>
</html>
